# ============================================================
# Docker Compose: Laravel + Inertia.js + Vue (Monolith)
# ============================================================
# 3 container:
#   - app:    PHP-FPM (Laravel app)
#   - nginx:  Web server (serve static + proxy ke PHP-FPM)
#   - mysql:  Database
# ============================================================

services:
  # --- PHP-FPM (Laravel app) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpm-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.lab
    volumes:
      - storage-data:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - app-public:/shared-public
    networks:
      - tpm-net
    depends_on:
      mysql:
        condition: service_healthy

  # --- Nginx (Web server) ---
  nginx:
    image: nginx:alpine
    container_name: tpm-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
    networks:
      - tpm-net
    depends_on:
      - app

  # --- MySQL (Database) ---
  mysql:
    image: mysql:8.0
    container_name: tpm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tpm_lab}
      MYSQL_USER: ${DB_USERNAME:-lab_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lab_pass_123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass_123}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - tpm-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

# --- Networks ---
networks:
  tpm-net:
    driver: bridge

# --- Volumes (persistent data) ---
volumes:
  mysql-data:
  storage-data:
  bootstrap-cache:
  app-public:
