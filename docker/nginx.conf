# ============================================================
# Nginx config untuk Laravel + Inertia.js
# ============================================================
# Nginx serve:
#   - Static files (CSS, JS, images dari Vite build) → langsung
#   - PHP requests → proxy ke PHP-FPM container (port 9000)
# ============================================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Laravel routing: coba file dulu, kalau tidak ada → index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve Vite built assets (CSS, JS) dengan cache panjang
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PHP files → proxy ke PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Block akses ke file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Laravel storage — block akses langsung
    location ~ ^/storage/ {
        internal;
    }
}
